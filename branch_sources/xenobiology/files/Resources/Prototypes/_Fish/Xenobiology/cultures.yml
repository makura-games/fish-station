- type: entity
  parent: BaseItem
  id: FishXenoCultureBase
  name: slime culture
  description: A dormant laboratory culture. Add five units of water and place it on the floor to hatch a juvenile slime.
  suffix: Fish
  abstract: true
  components:
  - type: Sprite
    sprite: _Fish/Xenobiology/Objects/extract_jellies.rsi
    state: jelly
  - type: Item
    size: Small
    sprite: _Fish/Xenobiology/Objects/extract_jellies.rsi
  - type: SolutionManager
    solutions: [FishXenoCultureSolution]
  - type: InjectableSolution
    solution: culture
  - type: RefillableSolution
    solution: culture
  - type: ExaminableSolution
    solution: culture
    exactVolume: true
  - type: StaticPrice
    price: 0

- type: entity
  parent: Solution
  id: FishXenoCultureSolution
  suffix: Fish
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: culture
    solution:
      maxVol: 10

