  - type: Tweak
    message: 'Финальное обновление разумной болезни: теперь лечение будет проходить более плавно, а летальность сделана более смертоносной. Добавлены сопротивления болезни для всех масок и противогазов. Пересбалансированы текущие симптомы.'
