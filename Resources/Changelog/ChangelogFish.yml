    message: Переработан рассказчик, теперь классический и безумный рассказчик заготавлиают крупную угрозу к часу раунда, при условии что станция не развивается слишком сильно. Если станция слишком слаба для принятия угрозы, то рассказчик дает события с бонусами для станции и минимизирует угрозы до наращивания силы.
  - type: Tweak
    message: Теперь Ядерные оперативники (включая одинокого) не могут появиться в рассказчике вместе с Диверсионным отрядом. Только одни из них - либо ядеры, либо ДО.
  - type: Tweak
    message: Ребаланс стоимости угроз у рассказчика. Слабые угрозы по типу абдукторов, ниндзи стали дешевле, а одиночный оперативник и дракон с пиратами - дороже. Крупные антагонисты теперь имеют одинаковую стоимость кроме ДО и Ксеноборгов - они дешевле других ввиду их специфики.
  - type: Tweak
    message: 'Немного переработана система бюджета рассказчика: теперь 20% от поступающих очков угрозы сохраняются в банк крупной угрозы (мажорка), что замедляет наступление других событий, но гарантирует крупную угрозу в поздних стадиях раунда.'
  id: 84
