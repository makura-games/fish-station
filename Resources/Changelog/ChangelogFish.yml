- author: Endennsss
  time: '2026-09-06T14:25:22.0000000+00:00'
  changes:
  - type: Tweak
    message: Обновлён интерфейс анализатора здоровья и МедТека. Цвет окна отражает состояние пациента, а при потере связи интерфейс становится серым.
  - type: Add
    message: Добавлено сравнение повреждений с предыдущим сканированием. Стрелки рядом с показателями показывают увеличение, уменьшение или отсутствие изменений.
  - type: Add
    message: Разделы повреждений, рекомендаций и реагентов теперь можно сворачивать нажатием на заголовок.
  - type: Add
    message: 'Добавлены рекомендации по лечению: от обычных медицинских средств при лёгких травмах до специализированных препаратов при серьёзных повреждениях. Отдельно учитываются кровотечение, кровопотеря и необходимость реанимации.'
  - type: Add
    message: Анализатор показывает реагенты в крови и отмечает уже введённые рекомендованные препараты.
  - type: Add
    message: Добавлены предупреждения о приближении к известным порогам побочных эффектов и их достижении. Предупреждения видны даже при свёрнутом разделе реагентов.
  id: 37
