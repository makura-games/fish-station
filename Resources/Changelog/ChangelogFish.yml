  - type: Add
    message: Оперативникам Синего Щита выдан специализированный аплинк "Синий щит" (20 БлюспейсКристаллов / 20 Кристаллитов).
  - type: Add
    message: 'В аплинк добавлены наборы основного оружия (с двумя магазинами: FMJ и HP), а также отдельные коробки патронов, спидлоадеры и магазины SP, HP, FMJ для всех доступных калибров.'
  - type: Add
    message: В раздел медицины аплинка добавлен продвинутый компактный дефибриллятор и заполненные автомендеры от физ. и терм. урона по 8 К каждый.
  - type: Add
    message: В раздел экипировки аплинка добавлены магнитные ботинки ОБР за 12 К, броня синего щита и скафандр за 10К.
