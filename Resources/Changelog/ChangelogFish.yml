  - type: Add
    message: Кольцо Синдиката добавлено в набор безделушек ядерных оперативников.
  - type: Tweak
    message: Боезапас в наборах огнестрельного оружия Синдиката увеличен на 33–250% в зависимости от набора, для лучшего понимания читайте обновленное описание в аплинке.
  - type: Tweak
    message: Для сборки двойного энергетического меча теперь требуется кольцо Синдиката. При разборке кольцо возвращается.
  - type: Tweak
    message: Пробивной молот Синдиката. Исправлены анимации удара и уменьшен размер молота в хранилищах.
  - type: Tweak
    message: Скафандр Инфильратор доступен сразу агентам, скафандр инфильтратор теперь проявляет силует игрока при активном движении.
  - type: Tweak
    message: Перчатки Корниворы больше не позволяют использовать огнестрельное оружие. Скорость атаки снижена.
