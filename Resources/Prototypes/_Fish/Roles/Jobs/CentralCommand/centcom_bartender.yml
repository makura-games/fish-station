  alwaysUseSpawner: true
  access:
  - Service
  - Maintenance
  - Bar
  - Kitchen
  - Hydroponics
  special:
   - !type:AddImplantSpecial
     implants: [ MindShieldImplant ]

- type: startingGear
  id: CentcommBartenderGear
  equipment:
    shoes: ClothingShoesColorBlack
    id: BartenderPDA
    ears: ClothingHeadsetService
