- type: reagent
  id: Ultimium
  name: reagent-name-ultimium
  desc: reagent-desc-ultimium
  physicalDesc: reagent-physical-desc-starry
  flavor: sweet
  color: "#62ff43"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:Oxygenate
        factor: 5.5          # нужно в 5.5 раз меньше газа, чтобы нормально дышать
      # Лечение ВСЕГО урона
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.1
        scaling: true
        ignoreResistances: true
        damage:
          types:
            Slash: -1.0
            Piercing: -1.0
            Blunt: -1.0
            Poison: -1.0
            Radiation: -1.0
            Cellular: -1.0
            Shock: -1.0
            Heat: -1.0
            Asphyxiation: -1.0
            Bloodloss: -1.0
      # Снятие алкоголя и сонливости
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.1
        reagent: Ethanol
        amount: -8
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.1
        effectProto: StatusEffectDrunk
        time: 6.0
        type: Remove
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.1
        key: ForcedSleep
        component: ForcedSleeping
        type: Remove
      # Долгий иммунитет к давлению
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.1
        key: PressureImmunity
        component: PressureImmunity
        type: Add
        time: 25.0
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Ultimium
          min: 0.15
        type: Local
        visualType: Medium
        messages: [ "Вы чувствуете невероятное облегчение во всём теле", "Все раны и боль быстро отступают" ]
        probability: 0.15

