        - !type:ReagentCondition
          reagent: Krypium
          min: 1.5  

- type: reagent
  id: Prallium
  name: reagent-name-prallium
  desc: reagent-desc-prallium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: sweet
  color: "#a0ffff"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.35
      effects:
      - !type:Oxygenate
        factor: 12          # нужно в 12 раз меньше газа, чтобы нормально дышать. Надо рецепт поменять на плюоксу.
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Prallium
          min: 0.3
        type: Local
        visualType: Medium
        messages: [ "Лёгкие наполняются чистым кислородом", "Дышать стало невероятно легко" ]
        probability: 0.1
      # Лёгкий негатив при сильной концентрации
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Prallium
          min: 1.8
        scaling: true
        damage:
          types:
            Poison: 0.25

- type: reagent
  id: Chaoson
  name: reagent-name-chaoson
  desc: reagent-desc-chaoson
  physicalDesc: reagent-physical-desc-funny
  flavor: weh
  color: "#ff69b4"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.4
      effects:
        # Ржет
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.2
        emote: Laugh
        showInChat: true
        probability: 0.6
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.4
        type: Local
        visualType: Large
        messages: [ "laughter-effect-control-laughter" ]
        probability: 0.18
        # Орет
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.2
        emote: Scream
        showInChat: true
        probability: 0.6
        # Вехает
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.5
        emote: Weh
        showInChat: true
        force: true
        probability: 0.6
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.6
        type: Local
        visualType: Medium
        messages: [ "Вех!", Вееееееееех~", "ВЕХ ВЕх веХ!", "ВЕЕЕЕЕЕх!!!" ]
        probability: 0.6
      # Бухой и трясется
      - !type:Drunk
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 0.7
        boozePower: 5
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 1.1
      # Полиморф в ящерицу при очень высокой концентрации
      - !type:Polymorph
        conditions:
        - !type:ReagentCondition
          reagent: Chaoson
          min: 45
        prototype: ArtifactLizard

