- type: reagent
  id: Zenthium
  name: reagent-name-zenthium
  desc: reagent-desc-zenthium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: sweet
  color: "#008d8d"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.8
      effects:
      - !type:MovementSpeedModifier
        conditions:
        - !type:ReagentCondition
          reagent: Zenthium
          min: 0.4
        walkSpeedModifier: 1.18
        sprintSpeedModifier: 1.18
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Zenthium
          min: 1.5
        scaling: true
        ignoreResistances: true
        damage:
          types:
            Cellular: -0.2
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Zenthium
          min: 0.5
        type: Local
        visualType: Medium
        messages: [ "Вы чувствуете лёгкую эйфорию", "Воздух кажется слишком сладким" ]
        probability: 0.08

- type: reagent
  id: Krypium
  name: reagent-name-krypium
  desc: reagent-desc-krypium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: metallic
  color: "#82005d"
  metabolisms:
