- type: entity
  parent: GasCanister
  id: ZenthiumCanister
  name: Zenthium Canister
  description: A canister that can hold any type of gas. This one supposedly contains Nitrium. Can be connected to a port with a wrench.
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Storage/canister.rsi
    layers:
    - state: nitrium
  - type: GasCanister
    gasMixture:
      volume: 1000
      moles:
        Zenthium: 1871.71051 # Zenthium
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          NitriumCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Lock
    locked: true

