# Fish edit start
- type: entity
  parent: BaseAction
  id: FishActionMimicJump
  name: Jump
  description: The mimic leaps towards the selected location.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
    itemIconStyle: NoItem
  - type: TargetAction
    range: 200
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MimicJumpActionEvent
# Fish edit end
