- type: entity
  parent: BaseChemistryEmptyBottle
  id: FishXenoSampleBottle
  name: xenobiology sample
  description: A reagent sample produced by a slime extract. Check its contents before use.
  suffix: Fish

- type: entity
  parent: PowerCellMedium
  id: FishXenoPowerCell
  name: bioelectric power cell
  description: A 720-joule power cell grown from a yellow slime extract. It has no self-charging mechanism.
  suffix: Fish
  components:
  - type: Battery
    maxCharge: 720
    startingCharge: 720

- type: entity
  parent: BaseItem
  id: FishXenoSerumBase
  name: slime serum
  description: A single-use genetic treatment for laboratory slimes. Apply it directly to a living slime; the change is inherited by its descendants.
  suffix: Fish
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    layers:
    - state: bottle-1
    - state: bottle-1-6
  - type: Item
    size: Tiny
    sprite: Objects/Specific/Chemistry/bottle.rsi
  - type: StaticPrice
    price: 0

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumMutation
  name: mutation serum
  description: Apply directly to a living laboratory slime. Increases inherited mutation probability by 10 percentage points, up to 100%.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#e35353'
  - type: FishXenobiologySerum
    treatment: Mutation

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumStability
  name: stability serum
  description: Apply directly to a living laboratory slime. Decreases inherited mutation probability by 10 percentage points, down to 0%.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#9e795c'
  - type: FishXenobiologySerum
    treatment: Stability

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumGrowth
  name: growth serum
  description: Apply directly to a living laboratory slime. Increases inherited growth speed by 15 percentage points, up to twice the normal rate.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#64ccd5'
  - type: FishXenobiologySerum
    treatment: Growth

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumYield
  name: yield serum
  description: Apply directly to a living laboratory slime. Increases inherited adult extract yield by one, up to three extracts.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#a66bd5'
  - type: FishXenobiologySerum
    treatment: Yield

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumFertility
  name: fertility serum
  description: Apply directly to a living laboratory slime. Increases inherited offspring count by one, up to four juveniles per division.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#78c765'
  - type: FishXenobiologySerum
    treatment: Fertility

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumDocility
  name: docility serum
  description: Apply directly to a living laboratory slime. Increases inherited docility by 25 percentage points, up to 100%.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#ef9ac5'
  - type: FishXenobiologySerum
    treatment: Docility

- type: entity
  parent: FishXenoSerumBase
  id: FishXenoSerumThermal
  name: thermal tolerance serum
  description: Apply directly to a living laboratory slime. Widens the inherited comfortable temperature range by 5 K on either side, up to 20 K.
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: bottle-1
    - state: bottle-1-6
      color: '#385ab5'
  - type: FishXenobiologySerum
    treatment: Thermal
