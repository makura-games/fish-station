# Fish-edit: катализатор связывает промышленную индукцию с исследованием третьего уровня.
- type: technology
  id: FishIndustrialXenobiology
  name: research-technology-fish-industrial-xenobiology
  icon:
    sprite: _Fish/Xenobiology/Objects/extract.rsi
    state: core
  discipline: Biochemical
  tier: 3
  cost: 15000
  technologyPrerequisites:
  - FishXenobiologyAdvanced
  - IndustrialEngineering
  recipeUnlocks:
  - FishXenoIndustrialCatalyst

- type: latheRecipe
  id: FishXenoIndustrialCatalyst
  result: FishXenoIndustrialCatalyst
  categories: [Tools]
  completetime: 5
  materials:
    Glass: 500
    Gold: 300
    Silver: 300
    Plasma: 500

- type: entity
  parent: BaseItem
  id: FishXenoIndustrialCatalyst
  name: industrial induction catalyst
  description: A sealed catalyst for industrial slime induction. Its label specifies one living adult laboratory slime and ten unused extracts of the same breed.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    state: bottle-1
    color: '#e5d785'
  - type: Item
    size: Tiny
  - type: FishXenobiologyIndustrialCatalyst
  - type: StaticPrice
    price: 0

