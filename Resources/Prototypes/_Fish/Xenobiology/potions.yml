# Fish-start: зелья ксенобиологии SS220 для прямого применения на слайма
- type: entity
  parent: BaseItem
  id: FishSlimePotionBase
  abstract: true
  suffix: Fish
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    state: bottle-1

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionStabilizerFish
  name: slime stabilizer
  description: Lowers a slime's mutation chance. Useless on corpses and non-slimes.
  components:
  - type: Sprite
    color: "#5b8fd4"
  - type: FishSlimePotion
    kind: Stabilizer

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionMutatorFish
  name: slime mutator
  description: Raises mutation chance once per slime.
  components:
  - type: Sprite
    color: "#c44"
  - type: FishSlimePotion
    kind: Mutator

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionSteroidFish
  name: slime steroid
  description: Gives a baby slime an extra core when processed.
  components:
  - type: Sprite
    color: "#9a6"
  - type: FishSlimePotion
    kind: Steroid

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionDocilityFish
  name: docility potion
  description: Calms a slime or removes rabies without full docility.
  components:
  - type: Sprite
    color: "#f6a"
  - type: FishSlimePotion
    kind: Docility

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionEnhancerFish
  name: extract enhancer
  description: Adds one use to a slime extract, up to five.
  components:
  - type: Sprite
    color: "#6cf"
  - type: FishSlimePotion
    kind: Enhancer

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionSpeedFish
  name: speed treat
  description: Heats a slime for a burst of speed. Does not stack if already hot.
  components:
  - type: Sprite
    color: "#f84"
  - type: FishSlimePotion
    kind: Speed

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionFireproofFish
  name: chill potion
  description: Fire-proofs a piece of clothing for three charges.
  components:
  - type: Sprite
    color: "#8cf"
  - type: FishSlimePotion
    kind: Fireproof

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionOilSlickFish
  name: oil slick potion
  description: Makes an item extremely slippery.
  components:
  - type: Sprite
    color: "#222"
  - type: FishSlimePotion
    kind: OilSlick

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionSentienceFish
  name: sentience potion
  description: Grants intelligence to animals. Handle with care.
  components:
  - type: Sprite
    color: "#fcf"
  - type: FishSlimePotion
    kind: Sentience

- type: entity
  parent: FishSlimePotionBase
  id: FishSlimePotionTransferenceFish
  name: consciousness transference potion
  description: Moves your mind into a creature. Extremely dangerous.
  components:
  - type: Sprite
    color: "#c8f"
  - type: FishSlimePotion
    kind: Transference
# Fish-end
