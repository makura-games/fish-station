- type: entity
  parent: BaseItem
  id: FishXenoExtractBase
  name: slime extract
  description: A single-use slime core. Consult the xenobiology console before adding five units of catalyst.
  suffix: Fish
  abstract: true
  components:
  - type: Sprite
    sprite: _Fish/Xenobiology/Objects/extract.rsi
    state: core
  - type: Item
    size: Tiny
    sprite: _Fish/Xenobiology/Objects/extract.rsi
  - type: SolutionManager
    solutions: [FishXenoExtractSolution]
  - type: InjectableSolution
    solution: extract
  - type: RefillableSolution
    solution: extract
  - type: ExaminableSolution
    solution: extract
    exactVolume: true
  - type: StaticPrice
    price: 0

- type: entity
  parent: Solution
  id: FishXenoExtractSolution
  suffix: Fish
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: extract
    solution:
      maxVol: 15

