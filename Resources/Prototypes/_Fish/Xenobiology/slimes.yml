- type: entity
  parent: [SimpleMobBase, MobCombat]
  id: FishSlimeBaseFish
  name: slime
  suffix: Fish
  abstract: true
  description: A gelatinous xenobiology slime.
  components:
  - type: FishSlime
  - type: Sprite
    drawdepth: Mobs
    sprite: _Fish/Xenobiology/slimes/slimes.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blue_adult_slime
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 2.2
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
        Caustic: 4
  - type: Damageable
    damageModifierSet: Slime
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: Temperature
  - type: AtmosExposed
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: VentCrawler
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

- type: entity
  parent: FishSlimeBaseFish
  id: FishSlimeGreyBabyFish
  name: grey baby slime
  suffix: Fish
  description: A grey xenobiology slime.
