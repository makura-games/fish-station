# Проливать лекарства, наркотики, токсины и пиротехнику - работа.
# Пассажиры и гости в списке сознательно нет.
- type: rpuModifier
  id: RpuRoleSpillWork
  source: Job
  jobs: [Chemist, MedicalDoctor, Paramedic, Brigmedic, SeniorPhysician,
         CentcommMedicalDoctor, Janitor, ERTJanitor, JanitorBorg, Barber,
         Bartender, Chef, Botanist, ServiceWorker, Musician, Mime, Clown, ClownBorg,
         Lawyer, Librarian, Chaplain, Psychologist, Reporter, ComMaid, CentcommBartender,
         CentcommChef, NanoTrasenRepresentative, IAA, MailCarrier, ServiceBorg, PeaceBorg,
         PrisonScientist]
  categories:
    Spill: 0.0

# Снабжение разбирает и рушит что хочет, кроме грузчика (он отвечает как все).
- type: rpuModifier
  id: RpuRoleCargoDestruction
  source: Job
  jobs: [Quartermaster, SalvageSpecialist, MiningSpecialist, Borg, MiningBorg]
  categories:
    Destruction: 0.0
    Deconstruction: 0.0
    Sabotage: 0.9

# Выездные роли: ОБР, РХБЗЗ, эскадрон смерти, пилоты СБ.
- type: rpuModifier
  id: RpuRoleSpecialResponse
  source: Job
  jobs: [SpecOpsOfficer, ERTLeader, ERTChaplain, ERTEngineer, ERTMedical, CBURN, CBURNLeader,
         CBURNAgentEVA, DeathSquad, SecurityPilot, BlueShieldOperative, NtrLeader, NtrOfficer,
         NtrGuard, USSPOfficer, USSPOfficerAlt, USSPSoldier, USSPCaptain]
  categories:
    Kill: 0.6
    KillSecurityChain: 0.6
    Crit: 0.4
    Explosion: 0.7
    AirlockHack: 0.4
    WireCut: 0.7
    Destruction: 0.5
    Deconstruction: 0.5
    Sabotage: 0.8
    Spill: 0.8
    Contraband: 0.6

# Силиконы и ИИ отвечают как обычный экипаж, но массовое открывание дверей им простительно.
- type: rpuModifier
