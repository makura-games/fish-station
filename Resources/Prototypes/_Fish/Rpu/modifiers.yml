# Fish-start - множители системы по ролям, отделам, антагонистам, обстановке и коду тревоги.
# Ключи categories = имена RpuCategory. 0.0 = полностью освобождает от этой категории.
# Перемножения нет: RpuMaths.CombineMultipliers берёт взвешенное геометрическое среднее,
# поэтому несколько льгот не превращаются в неуязвимость.
- type: rpuModifier
  id: RpuDeptSecurity
  source: Department
  departments: [Security, PlanetPrisonSecurity, BlueShield, Court, Law]
  categories:
    Kill: 0.9
    KillSecurityChain: 0.9
    Crit: 0.65
    Explosion: 0.9
    AirlockHack: 0.7
    WireCut: 0.8
    Destruction: 0.9
    Deconstruction: 0.9
    Sabotage: 0.9
    Spill: 0.9
    Slip: 0.8
    Contraband: 0.8

- type: rpuModifier
