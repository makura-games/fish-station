# Game rules: шаттлы ОБР / РХБЗЗ для вызова через консоли Fish.
# weight: 0 — не участвуют в случайном планировщике событий.

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseFishObrShuttleRule
  components:
  - type: StationEvent
    startAnnouncement: null
    startAudio: /Audio/_Fish/Misc/yesert.ogg
    # null — правило не автозавершается; шаттл остаётся, повторный вызов блокируется.
    duration: null
    maxOccurrences: 99
    weight: 0
  - type: RuleGrids
  - type: LoadMapRule

- type: entity
  id: FishObrShuttleAmber
  parent: BaseFishObrShuttleRule
  components:
