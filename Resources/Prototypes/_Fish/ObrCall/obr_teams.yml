# Цены и доступность вызова ОБР. Не хардкодить суммы в C#.
# cryoRoleSpawners.roleKey сопоставляет спавнер с SpawnOnTrigger-точками на ЦК.

- type: obrTeam
  id: ObrAmber
  name: obr-team-amber-name
  description: obr-team-amber-desc
  gameRule: FishObrShuttleAmber
  stationCost: 100000
  centCommAvailable: true
  stationAvailable: true
  account: Cargo
  priorityTag: DockFishERT
  sortOrder: 10
  # Состав как у первой кнопки «вызов ОБР» на ЦК.
  cryoRoleSpawners:
  - spawner: RandomHumanoidSpawnerERTLeaderAmber
    roleKey: Leader
  - spawner: RandomHumanoidSpawnerERTEngineerAmber
    roleKey: Engineer
  - spawner: RandomHumanoidSpawnerERTMedicalAmber
    roleKey: Medical
  - spawner: RandomHumanoidSpawnerERTChaplainAmber
    roleKey: Chaplain
  - spawner: RandomHumanoidSpawnerERTSecurityAmber
    roleKey: Security
  - spawner: RandomHumanoidSpawnerERTSecurityAmber
    roleKey: Security
  - spawner: RandomHumanoidSpawnerERTSecurityAmber
    roleKey: Security

