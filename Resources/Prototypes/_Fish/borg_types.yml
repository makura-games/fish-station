- type: borgType
  id: FishMiningMk2
  parent: mining
  hideInMenu: true
  dummyPrototype: FishBorgChassisMiningMk2
  # Шаблон с belt-слотом (обычные борги остаются на borgShort/borgTall/borgDutch).
  inventoryTemplateId: FishBorgTallMk2
  # miner_moving в _Fish отсутствует — кадр ходьбы откатываем на корпус,
  # чтобы не ловить State not found при движении.
  spriteBodyMovementState: miner
  spriteRsiPath: _Fish/Mobs/Silicon/chassis.rsi
  spriteScale: 0.8
  spriteOffset: 0,0.4
  spriteWreckState: miner_wreck
  spriteRestingState: miner_rest

