# Borg Mk2: девять вариантов поверх обычных специализаций.
# Каждый наследует свой обычный borgType (механика, модули, слоты, радио, работы — идентичны),
# скрыт из меню выбора (hideInMenu) и отличается визуалом.
#
# Уникальность визуала даёт RSI у chassis (_Fish/Mobs/Silicon/chassis.rsi), а не имя state:
# spriteBodyState у восьми типов совпадает с родителем и берётся из холста chassis.
# Отдельные имена state нужны только FishSecurityMk2 (sec_mk2*).
# *_rest подключены через spriteRestingState (механика отдыха BorgRest);
# *_tipped из _Fish больше нигде не используются — иконка действия отдыха взята как
# их квадратная обрезка (_Fish/Actions/borg_rest.rsi).
# *_wreck подключены через spriteWreckState: переключение на критическом/мёртвом
# состоянии выполняет клиентский BorgSystem (Content.Client/_Fish/.../BorgSystem.Wreck.cs).

- type: borgType
  id: FishGenericMk2
  parent: generic
  hideInMenu: true
  dummyPrototype: FishBorgChassisGenericMk2
  # Шаблон с belt-слотом (обычные борги остаются на borgShort/borgTall/borgDutch).
  inventoryTemplateId: FishBorgShortMk2
  # Mk2 рисуется с холста _Fish вместо Mobs/Silicon/chassis.rsi: масштаб 0.8
  # (тело крупнее vanilla-пропорций) и смещение 0,0.4 (= 0,0.5 × 0.8,
  # т.к. корневой Offset не масштабируется Scale).
  spriteRsiPath: _Fish/Mobs/Silicon/chassis.rsi
  spriteScale: 0.8
  spriteOffset: 0,0.4
  spriteWreckState: robot_wreck
  spriteRestingState: robot_rest

- type: borgType
  id: FishEngineeringMk2
  parent: engineering
  hideInMenu: true
  dummyPrototype: FishBorgChassisEngineerMk2
  # Шаблон с belt-слотом (обычные борги остаются на borgShort/borgTall/borgDutch).
