# Borg Mk2: девять вариантов поверх обычных специализаций.
# Каждый наследует свой обычный borgType (механика, модули, слоты, радио, работы — идентичны),
# скрыт из меню выбора (hideInMenu) и отличается визуалом.
#
# Уникальность визуала даёт RSI у chassis (_Lust/Mobs/Silicon/chassis.rsi), а не имя state:
# spriteBodyState у восьми типов совпадает с родителем и берётся из холста chassis.
# Отдельные имена state нужны только securityMk2 (sec_mk2*).
# *_rest / *_tipped / *_wreck из _Lust не используются и сюда не переносятся.

- type: borgType
  id: genericMk2
  parent: generic
  hideInMenu: true
  dummyPrototype: BorgChassisGenericMk2
  # Fish: шаблон с belt-слотом (обычные борги остаются на borgShort/borgTall/borgDutch).
  inventoryTemplateId: borgShortMk2
  # Mk2 рисуется с холста _Lust вместо Mobs/Silicon/chassis.rsi, со смещением 0,0.5.
  spriteRsiPath: _Lust/Mobs/Silicon/chassis.rsi
  spriteOffset: 0,0.5

- type: borgType
  id: engineeringMk2
  parent: engineering
  hideInMenu: true
  dummyPrototype: BorgChassisEngineerMk2
  # Fish: шаблон с belt-слотом (обычные борги остаются на borgShort/borgTall/borgDutch).
  inventoryTemplateId: borgShortMk2
