- type: entity
  parent: BaseAction
  id: FishActionCallClockworkArmor
  name: call clockwork armor
  description: Summons your bound brass armor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Fish/ClockworkCult/actions.rsi
    layers:
    - state: clockwork_armor
  - type: InstantAction
    event: !type:FishClockworkCallArmorActionEvent

- type: entity
