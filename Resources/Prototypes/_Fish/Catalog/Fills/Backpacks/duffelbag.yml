# Наборы оружия оперативников Синий Щит

# Набор АШ-12 (Пули + Травматические)
- type: entity
  id: FishClothingBackpackDuffelWeaponAsh12BlueShield
  parent: ClothingBackpackDuffelMilitary
  name: Bundle ASH-12
  description: ASH-12 with 1 Slug magazine and 1 Beanbag magazine.
  components:
