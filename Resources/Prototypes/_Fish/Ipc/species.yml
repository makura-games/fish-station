# Fish-start: раса КПБ (Paradise Machine / IPC)
- type: species
  id: Ipc
  name: species-name-ipc
  roundStart: true
  prototype: MobIpc
  bodyTypes:
  - IpcNormal
  dollPrototype: AppearanceIpc
  skinColoration: Hues
  naming: FirstDashLast
  maleFirstNames: NamesIpcFirst
  femaleFirstNames: NamesIpcFirst
  maleLastNames: NamesIpcLast
  femaleLastNames: NamesIpcLast
  youngAge: 1
  oldAge: 40
  maxAge: 58 # Paradise Machine age_sheet
  defaultSoundsBySex:
  - UnisexIpc
  - UnisexIpc
  - UnisexIpc
  voices:
  - UnisexIpc
  sexes:
  - Unsexed
  - Male
  - Female
  buttScan:
    sprite: /Textures/_Sunrise/CopyMachine/butts_scans.rsi
    state: human

- type: bodyType
  id: IpcNormal
  name: body-normal
  visualKey: body-normal
  layers:
    Head:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: head_m
    Chest:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: torso_m
    LArm:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: l_arm
    RArm:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: r_arm
    LHand:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: l_hand
    RHand:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: r_hand
    LLeg:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: l_leg
    RLeg:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: r_leg
    LFoot:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: l_foot
    RFoot:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
      state: r_foot
  sexLayers:
    Male:
      Head:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: head_m
      Chest:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: torso_m
    Female:
      Head:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: head_f
      Chest:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: torso_f
    Unsexed:
      Head:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: head_m
      Chest:
        sprite: _Fish/Mobs/Species/Ipc/parts.rsi
        state: torso_m

- type: markingsGroup
  id: Ipc
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
      default: [ ScreenStatic ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
      default: [ MobIPCTorsoDefault ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
      default: [ MobIPCHeadDefault ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
      default: [ MobIPCLArmDefault ]
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
      default: [ MobIPCRArmDefault ]
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
      default: [ MobIPCLHandDefault ]
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
      default: [ MobIPCRHandDefault ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
      default: [ MobIPCLLegDefault ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
      default: [ MobIPCRLegDefault ]
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
      default: [ MobIPCLFootDefault ]
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
      default: [ MobIPCRFootDefault ]
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
# Fish-end
