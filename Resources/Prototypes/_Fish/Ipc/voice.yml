# Fish-start: голос и эмоции КПБ
- type: emoteSounds
  id: UnisexIpc
  params:
    variation: 0.05
  sounds:
    Scream:
      path: /Audio/_Fish/Voice/Ipc/robot-scream.ogg
    Laugh:
      path: /Audio/_Fish/Voice/Ipc/robot-laugh_3.ogg
    Beep:
      path: /Audio/_Fish/Voice/Ipc/beep_500.ogg
    Chime:
      path: /Audio/_Fish/Voice/Ipc/beep_2000.ogg
    Buzz:
      path: /Audio/_Fish/Voice/Ipc/whirr1.ogg
    Honk:
      path: /Audio/_Fish/Voice/Ipc/pai_whistle.ogg
    Whistle:
      path: /Audio/_Fish/Voice/Ipc/pai_whistle.ogg
    Crying:
      path: /Audio/_Fish/Voice/Ipc/cry_robot_1.ogg
    # Fish-edit: Paradise machine — Бип буп, Пинг, кашель шасси, предсмертный хрип
    Buzz-Two:
      collection: FishIpcBuzzTwo
    Ping:
      collection: FishIpcPing
    SevereCough:
      collection: FishIpcMachineCough
