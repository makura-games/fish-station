# Fish-start: органы КПБ
# OrganBase без edible/meat — шасси не еда.
- type: entity
  parent: OrganBase
  id: OrganIpc
  abstract: true
  suffix: IPC

- type: entity
  parent: OrganIpc
  id: OrganIpcExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Fish/Mobs/Species/Ipc/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Ipc
  - type: GibbableOrgan

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganIpcExternal ]
  id: OrganIpcTorso
  name: torso
  description: A metal torso for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseHead, OrganIpcExternal ]
  id: OrganIpcHead
  name: head
  description: A metal head for an integrated positronic chassis.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/parts.rsi
    state: head_m

- type: entity
  parent: [ OrganBaseArmLeft, OrganIpcExternal ]
  id: OrganIpcArmLeft
  name: left arm
  description: A left arm for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseArmRight, OrganIpcExternal ]
  id: OrganIpcArmRight
  name: right arm
  description: A right arm for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseHandLeft, OrganIpcExternal ]
  id: OrganIpcHandLeft
  name: left hand
  description: A left hand for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseHandRight, OrganIpcExternal ]
  id: OrganIpcHandRight
  name: right hand
  description: A right hand for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseLegLeft, OrganIpcExternal ]
  id: OrganIpcLegLeft
  name: left leg
  description: A left leg for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseLegRight, OrganIpcExternal ]
  id: OrganIpcLegRight
  name: right leg
  description: A right leg for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseFootLeft, OrganIpcExternal ]
  id: OrganIpcFootLeft
  name: left foot
  description: A left foot for an integrated positronic chassis.

- type: entity
  parent: [ OrganBaseFootRight, OrganIpcExternal ]
  id: OrganIpcFootRight
  name: right foot
  description: A right foot for an integrated positronic chassis.

# Внутренние компоненты (Paradise: posibrain, optical sensor, microphone, cell)
- type: entity
  parent: [ OrganBaseBrain, OrganIpc ]
  id: OrganIpcPosibrain
  name: positronic brain
  description: A positronic brain for an integrated positronic chassis.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/organs.rsi
    layers:
    - state: microcell
  - type: Organ

- type: entity
  parent: [ OrganBaseEyes, OrganIpc ]
  id: OrganIpcEyes
  name: optical sensors
  description: Robotic optical sensors. They are not damaged by welding.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/organs.rsi
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Eyes
      group: Ipc
  - type: FlashImmunity
    showInExamine: false

- type: entity
  parent: [ OrganBaseEars, OrganIpc ]
  id: OrganIpcEars
  name: microphone
  description: Sonic receptors for an IPC chassis.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/organs.rsi
    state: ears

- type: entity
  parent: [ OrganBaseTongue, OrganIpc ]
  id: OrganIpcTongue
  name: vocal modulator
  description: Produces speech for a positronic chassis.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/organs.rsi
    state: tongue

- type: entity
  parent: [ OrganBaseHeart, OrganIpc ]
  id: OrganIpcCell
  name: microbattery
  description: A small, powerful cell for a fully prosthetic body.
  components:
  - type: Sprite
    sprite: _Fish/Mobs/Species/Ipc/organs.rsi
    state: heart-on
# Fish-end
