# Fish-start: встроенные модули КПБ для ОБР / CBURN / DeathSquad / NukeOps
# Кап хоста = 3. EmpScreen всем. Vision-слот один (exclusionGroup: vision).
# Батарея — PowerCellSyndicate (аплинк нюкеров), sealPowerCell: не извлекается.
# ApcAdapter / ToolHand не выдаём: зарядка от ЛКП уже есть у FishBatteryDrinker.

- type: fishIpcRoleModuleLoadout
  id: FishIpcModulesERTLeader
  role: ERTLeader
  powerCell: PowerCellSyndicate
  sealPowerCell: true
  modules:
  - FishIpcModuleEmpScreen
  - FishIpcModuleNightVision
  - FishIpcModuleNanoRepair

