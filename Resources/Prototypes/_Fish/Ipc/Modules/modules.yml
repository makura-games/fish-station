# --- T4 ---
- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleNanoRepair
  name: IPC nanorepair module
  description: Microscopic repair drones slowly mend chassis damage while hungrily draining the battery.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 1.2
    exclusionGroup: repair
    minChargeFraction: 0.1
  - type: FishIpcPassiveHealModule
    healPerSecond:
      types:
        Blunt: -0.022
        Slash: -0.022
        Piercing: -0.023
        Heat: -0.033
        Shock: -0.034

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleReactiveRepair
  name: IPC reactive repair module
  description: Faster micro-repairs than nanorepair, still hungry. Mutually exclusive with nanorepair.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 1.6
    exclusionGroup: repair
    minChargeFraction: 0.12
  - type: FishIpcPassiveHealModule
    healPerSecond:
      types:
        Blunt: -0.04
        Slash: -0.04
        Piercing: -0.04
        Heat: -0.05
        Shock: -0.05

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleEmpScreen
  name: IPC EMP screen module
  description: Partial EMP shielding for the chassis. Not full immunity.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.45
  - type: FishIpcEmpScreenModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleMagneticJoints
  name: IPC magnetic joints module
  description: Magnetic couplings resist limb amputation. EMP temporarily disables the effect.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.4
    exclusionGroup: joints
  - type: FishIpcMagneticJointsModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleSealedJoints
  name: IPC sealed joints module
  description: Sealed couplings block amputation. EMP locks the chassis hard. Mutually exclusive with magnetic joints.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.5
    exclusionGroup: joints
  - type: FishIpcSealedJointsModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleJumpstarter
  name: IPC jumpstarter module
  description: Capacitor dump that can claw a chassis out of critical — not death. Long cooldown.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.2
  - type: FishIpcJumpstarterModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleDefib
  name: IPC defibrillator module
  description: Integrated defibrillator pads. Consumes a huge slice of the battery per zap.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.25
  - type: FishIpcDefibModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleRadFilter
  name: IPC radiation filter module
  description: Cuts radiation and related cellular damage at the cost of constant drain.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.6
