# Fish-start: модули КПБ v1 (без anti-drop)

# --- T3 ---
- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleWireInterface
  name: IPC wire interface module
  description: A diagnostic interface that highlights chassis wiring. Barely draws power, but occupies a module slot.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.05
  - type: FishIpcWireInterfaceModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleApcAdapter
  name: IPC APC adapter module
  description: Accelerates chassis charging from APCs and compatible sources. Still finite.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.1
  - type: FishIpcApcAdapterModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleVocalMod
  name: IPC vocal modulator module
  description: Keeps built-in radio online even when the chassis is power-starved.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.15
  - type: FishIpcVocalModModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleToolHand
  name: IPC tool-hand module
  description: Mounts a single integrated crowbar into a free hand. Not a full toolset.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.2
  - type: FishIpcToolHandModule
    toolPrototype: Crowbar

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleMedHud
  name: IPC medical optics module
