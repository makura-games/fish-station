# --- T4 ---
- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleNanoRepair
  name: IPC nanorepair module
  description: Draws 1.2 J/s above 10% charge. Brute -0.15/s, heat and shock -0.2/s. Not with reactive repair.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 1.2
    exclusionGroup: repair
    minChargeFraction: 0.1
  - type: FishIpcPassiveHealModule
    healPerSecond:
      types:
        Blunt: -0.15
        Slash: -0.15
        Piercing: -0.15
        Heat: -0.2
        Shock: -0.2

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleReactiveRepair
  name: IPC reactive repair module
  description: Draws 1.6 J/s above 12% charge. Brute -0.35/s, heat and shock -0.4/s. Not with nanorepair.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 1.6
    exclusionGroup: repair
    minChargeFraction: 0.12
  - type: FishIpcPassiveHealModule
    # Чуть сильнее наноремонта; накопитель в системе чинит FixedPoint2-обнуление.
    healPerSecond:
      types:
        Blunt: -0.35
        Slash: -0.35
        Piercing: -0.35
        Heat: -0.4
        Shock: -0.4

