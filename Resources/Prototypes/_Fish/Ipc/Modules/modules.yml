# Fish-start: модули КПБ v1 (без anti-drop)

# --- T3 ---
- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleWireInterface
  name: IPC wire interface module
  description: Draws 0.05 J/s. Examining a panel reports whether it is open or closed. Toggleable.
  suffix: Fish
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: FishIpcModule
    passiveDrainPerSecond: 0.05
  - type: FishIpcModulePowerToggle
  - type: FishIpcWireInterfaceModule

- type: entity
  parent: FishBaseIpcModule
  id: FishIpcModuleApcAdapter
  name: IPC APC adapter module
