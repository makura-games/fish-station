# Fish-start: сущности КПБ
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIpc
  categories: [ HideSpawnMenu ]
  name: ipc appearance
  components:
  - type: Inventory
    templateId: human
  - type: InitialBody
    organs:
      Torso: OrganIpcTorso
      Head: OrganIpcHead
      ArmLeft: OrganIpcArmLeft
      ArmRight: OrganIpcArmRight
      HandRight: OrganIpcHandRight
      HandLeft: OrganIpcHandLeft
      LegLeft: OrganIpcLegLeft
      LegRight: OrganIpcLegRight
      FootLeft: OrganIpcFootLeft
      FootRight: OrganIpcFootRight
      Brain: OrganIpcPosibrain
      Eyes: OrganIpcEyes
      Tongue: OrganIpcTongue
      Ears: OrganIpcEars
      Heart: OrganIpcCell
  - type: HumanoidProfile
    species: Ipc

- type: entity
  parent:
  - AppearanceIpc
  - BaseSpeciesMob
  - MobFlammable
  - MobAtmosExposed
  id: MobIpc
  name: Urist McPositronic
  description: A positronic brain in a metal body.
  components:
  - type: Icon
    sprite: _Fish/Mobs/Species/Ipc/parts.rsi
    state: full
  - type: Damageable
    damageModifierSet: Ipc
  - type: Injurable
    damageContainer: Ipc
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#DD8822"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      90: 0.5
      120: 0.3
  - type: Temperature
    temperature: 310.15
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: 200
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 1.5
  - type: Flammable
    fireSpread: true
    canResistFire: true
    damage:
      types:
        Heat: 0.75
  - type: Barotrauma
    damage:
      types:
        Blunt: 0
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Vocal
    emoteSounds: UnisexIpc
    wilhelm: /Audio/_Fish/Voice/Ipc/wilhelm.ogg
    wilhelmProbability: 0.001
  - type: TypingIndicator
    proto: robot
  - type: ZombieImmune
  - type: FlashImmunity
    showInExamine: false
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types: {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        whitelist:
          tags:
          - PowerCell
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
  - type: Satiation
    satiations:
      Hunger:
        prototype: IpcSatiationHunger
      Thirst:
        prototype: IpcSatiationThirst
  # Inherited Internals (BaseSpeciesMob) Resolve Respirator on gear equip; IPC does not breathe.
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0
    damageRecovery:
      types:
        Asphyxiation: 0
  - type: RespiratorImmunity
  - type: FishIpc
    batteryPowered: true
    drainPerSecond: 1.5
    chargeThresholdMid: 0.8
    chargeThresholdLow: 0.35
    chargeThresholdCritical: 0.1
    speedModifierThresholds:
      4: 1
      3: 1
      2: 0.8
      1: 0.45
      0: 0
  - type: FishBatteryDrinker
  - type: FishWeldingHealable # Fish-edit: сварка чинит burn (Paradise welder); brute — кабелем
  - type: FishDeadStartupButton
  - type: FishEmitBuzzWhileDamaged
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 6
  - type: Butcherable
    spawned:
    - id: SheetSteel1
      amount: 3
    - id: CableApcStack1
      amount: 1
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Synth
  - type: FootprintEmitter
  - type: GuideHelp
    guides:
    - FishIpc

- type: entity
  parent: AppearanceIpc
  id: MobIpcDummy
  categories: [ HideSpawnMenu ]
  name: Urist McPositronic
  description: A dummy IPC for character setup.
  components:
  - type: HumanoidProfile
    species: Ipc
# Fish-end
