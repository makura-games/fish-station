- type: entity
  id: FishActionNetrunnerTerminal
  parent: BaseAction
  name: netrunner terminal
  description: Check memory, camera connection and recent programs, or open the script shop.
  suffix: Fish
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Actions/Implants/implants.rsi
    layers:
    - state: freedom
      map: ["enum.ActionVisuals.Icon"]
    - state: freedom
      visible: false
      map: ["enum.ActionVisuals.IconToggled"]
  - type: InstantAction
    event: !type:NetrunnerTerminalActionEvent

- type: entity
  id: FishActionNetrunnerBase
  parent: BaseAction
  abstract: true
  suffix: Fish
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Actions/Implants/implants.rsi
    layers:
    - state: freedom
      map: ["enum.ActionVisuals.Icon"]
    - state: freedom
      visible: false
      map: ["enum.ActionVisuals.IconToggled"]
  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    rotateOnUse: false

- type: entity
  id: FishActionNetrunnerOpenAirlock
  parent: FishActionNetrunnerBase
  name: open airlock
  description: Opens one powered, unbolted airlock. Physical locks are not bypassed.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - Airlock
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerOpenAirlock

- type: entity
  id: FishActionNetrunnerDisableCamera
  parent: FishActionNetrunnerBase
  name: disrupt camera
  description: Disables one camera for 20 seconds. Its image and neural coverage become unavailable.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - SurveillanceCamera
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerDisableCamera

- type: entity
  id: FishActionNetrunnerDisableLight
  parent: BaseAction
  name: area blackout
  description: Suppresses powered lights in a 7 meter radius for 5 minutes. Select the center of the area.
  suffix: Fish
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Actions/Implants/implants.rsi
    layers:
    - state: freedom
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:NetrunnerAreaHackActionEvent
      ability: FishNetrunnerDisableLight

- type: entity
  id: FishActionNetrunnerDisableSensors
  parent: FishActionNetrunnerBase
  name: disrupt suit sensors
  description: Suppresses reports from a target's worn suit sensors for 20 seconds.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerDisableSensors

- type: entity
  id: FishActionNetrunnerDisableHeadset
  parent: FishActionNetrunnerBase
  name: disrupt headset
  description: Blocks a target's equipped headset transmission and reception for 15 seconds.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerDisableHeadset

- type: entity
  id: FishActionNetrunnerNeuralOverload
  parent: FishActionNetrunnerBase
  name: neural overload
  description: Covertly overloads a genuine mindshield implant and paralyzes its wearer for 6 seconds. No target warning or security notification is transmitted.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerNeuralOverload

- type: entity
  id: FishActionNetrunnerShortCircuit
  parent: FishActionNetrunnerBase
  name: short circuit
  description: Damages a borg's electronic chassis with an electrical overload. Organic targets are incompatible.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerShortCircuit

- type: entity
  id: FishActionNetrunnerMotorInterference
  parent: FishActionNetrunnerBase
  name: motor interference
  description: Slows a borg or a genuine mindshield implant wearer by 35 percent for 7 seconds. Does not paralyze the target.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerMotorInterference

- type: entity
  id: FishActionNetrunnerOpticalGlitch
  parent: FishActionNetrunnerBase
  name: optical glitch
  description: Obscures a borg's vision or a worn electronic HUD visor for 3 seconds. Removing the visor restores sight immediately.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerOpticalGlitch

- type: entity
  id: FishActionNetrunnerLockWeapon
  parent: FishActionNetrunnerBase
  name: lock energy weapon
  description: Prevents an energy gun from firing for 6 seconds. Target the gun or a person holding it in their active hand; conventional firearms are incompatible.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Gun
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerLockWeapon

- type: entity
  id: FishActionNetrunnerGripShock
  parent: FishActionNetrunnerBase
  name: grip reset
  description: Makes a borg or a genuine mindshield wearer drop the item in their active hand.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [MobState]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerGripShock

- type: entity
  id: FishActionNetrunnerNeuralStatic
  parent: FishActionNetrunnerBase
  name: neural static
  description: Causes 30 stamina damage to a borg or a genuine mindshield wearer, subject to normal resistance.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [MobState]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerNeuralStatic

- type: entity
  id: FishActionNetrunnerThermalSurge
  parent: FishActionNetrunnerBase
  name: thermal surge
  description: Heats a borg or a genuine mindshield wearer by up to 6 degrees through their compromised electronics.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [MobState]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerThermalSurge

- type: entity
  id: FishActionNetrunnerBatteryDrain
  parent: FishActionNetrunnerBase
  name: battery discharge
  description: Drains 10 percent of a borg or energy weapon battery's capacity without destroying the cell.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [MobState, Gun]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerBatteryDrain

- type: entity
  id: FishActionNetrunnerLockAirlock
  parent: FishActionNetrunnerBase
  name: airlock loop
  description: Prevents a closed, powered airlock from opening for 12 seconds. Its physical bolt settings remain intact.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [Airlock]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerLockAirlock

- type: entity
  id: FishActionNetrunnerEraseTrace
  parent: FishActionNetrunnerBase
  name: buffer purge
  description: Clears a visible device's netrunner diagnostic records. The terminal's private journal remains intact.
  suffix: Fish
  components:
  - type: EntityTargetAction
    whitelist:
      components: [Airlock, PoweredLight, SurveillanceCamera, Gun, MobState]
    event: !type:NetrunnerHackActionEvent
      ability: FishNetrunnerEraseTrace
