- type: entity
  categories: [ HideSpawnMenu, Debug ]
  parent: MarkerBase
  id: Marker14567
  suffix: Drops the server headfirst on tile, use at your own risk.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - state: centcom
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: Marker14567Boom
  - type: TimedDespawn 
    lifetime: 5


- type: entity
  categories: [ HideSpawnMenu, Debug ]
  parent: MarkerBase
  id: Marker14567Boom
  suffix: Drops the server headfirst on tile, use at your own risk.
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - state: centcom
  - type: TimedDespawn 
    lifetime: 5
  - type: SpawnOnDespawn
    prototype: GatewayCore
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DemolitionCharge
    maxIntensity: 50000
    intensitySlope: 1
    totalIntensity: 90000
    maxTileBreak: 0
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: GatewayCore
      - id: MARKERMarkerStartItemGatewayCoreFlatpack


