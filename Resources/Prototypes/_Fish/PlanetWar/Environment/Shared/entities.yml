- type: entity
  categories: [ HideSpawnMenu ]
  parent: CannabisSeeds
  id: CannabisSeedsWM
  components:
    - type: Seed
      seedId: cannabisWM
    - type: PhysicalComposition
      materialComposition:
        MoneyWarMizMaterial: 20


- type: entity
  categories: [ HideSpawnMenu ]
  parent: LeavesCannabis
  id: LeavesCannabisWM
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: THCPW
        Quantity: 10
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 100
  - type: SpawnItemsOnUse
    uses: 1
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/unwrap.ogg
    items:
    - id: MoneyWarMiz100


- type: entity
  categories: [ HideSpawnMenu ]
  parent: LeavesCannabisWM
  id: LeavesCannabisDopWM
  components:
  - type: PhysicalComposition
    materialComposition:
      ShtampMagazinMaterial: 100
  - type: SpawnItemsOnUse
    items:
    - id: ShtampMagazin


- type: entity
  categories: [ HideSpawnMenu ]
  parent: MarkerBase
  id: MarkerLeavesCannabisWM
  components:
  - type: TimedDespawn 
    lifetime: 3
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: true
    table: !type:GroupSelector
      children:
      - id: LeavesCannabisDopWM
        weight: 20
      - id: LeavesCannabisWM
        weight: 80


- type: entity
  categories: [ HideSpawnMenu ]
  parent: CottonSeeds
  id: CottonSeedsWM
  components:
    - type: Seed
      seedId: cottonWM
    - type: PhysicalComposition
      materialComposition:
        MoneyWarMizMaterial: 20


- type: entity
  categories: [ HideSpawnMenu ]
  id: CottonBolWM
  parent: FoodProduceBase
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/cotton.rsi
  - type: FlavorProfile
    flavors:
      - cotton
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: FiberPW
        Quantity: 10
  - type: Produce
    seedId: cottonWM
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 100
  - type: SpawnItemsOnUse
    uses: 1
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/unwrap.ogg
    items:
    - id: MoneyWarMiz100


- type: entity
  categories: [ HideSpawnMenu ]
  parent: CottonBolWM
  id: CottonBolDopWM
  components:
  - type: PhysicalComposition
    materialComposition:
      ShtampMagazinMaterial: 100
  - type: SpawnItemsOnUse
    items:
    - id: ShtampMagazin


- type: entity
  categories: [ HideSpawnMenu ]
