  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: true
    table: !type:GroupSelector
      children:
      - id: CottonBolDopWM
        weight: 20
      - id: CottonBolWM
        weight: 80


- type: entity
  categories: [ HideSpawnMenu ]
  parent: PlantBag
  id: PlantBagWM
  components:
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 300


- type: entity
  categories: [ HideSpawnMenu ]
  id: SmokeScreenImplanterWM
  parent: SmokeScreenImplanter
  components:
  - type: Implanter
    implant: SmokeScreenImplantWM


- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionActivateBombGrenadeImplantWM
  parent: ActionActivateSmokeGrenadeImplant
  components:
  - type: Action
    icon:
      sprite: /Textures/Actions/Implants/implants.rsi
      state: explosive
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 1000


- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionActivateLandmineSpawnImplantWM
  parent: ActionActivateSmokeGrenadeImplant
  components:
  - type: Action
    icon:
      sprite: Objects/Misc/landmine.rsi
      state: landmine
    useDelay: 1
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 7


- type: entity
  categories: [ HideSpawnMenu ]
  parent: SmokeScreenImplant
  id: SmokeScreenImplantWM
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateSmokeGrenadeImplant
  - type: TriggerOnActivateImplant


- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionActivateSmokeGrenadeImplantWM
  parent: ActionActivateSmokeGrenadeImplant
  components:
  - type: LimitedCharges
    maxCharges: 3
  - type: AutoRecharge
    rechargeDuration: 30
