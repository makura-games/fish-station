# PlanetWar ammo boxes — контейнеры патронов (не магазины).
# Цена: 3 кредита; размер 2×2; TimedDespawn отменяется при подборе.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxWM
  categories: [ HideSpawnMenu ]
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    cycleable: false
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 3
  - type: TimedDespawn
    lifetime: 100
  - type: CancelTimedDespawnOnInsert
  - type: Tag
    tags:
    - TehfabTagWM

# .35 pistol — mag 20 × 5 = 100
- type: entity
  parent: BaseMagazineBoxWM
  id: MagazineBoxPistolWM
  name: ammunition box (.35 WM)
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgePistol
    proto: CartridgePistolWM
    capacity: 100
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: sp

