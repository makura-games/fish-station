- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseLandMineWM
  id: LandMineFleshCoreWM
  components:
  - type: StepTrigger
    blacklist:
      components:
        - AdminMinigun 
  - type: Sprite
    drawdepth: Items
    sprite: Objects/Misc/landmine.rsi
    layers:
    - state: landmine
    - state: landmineCoreLayers
      sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    - state: landmineCoreUnshaded
      sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
      shader: unshaded
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: FlashOnTrigger
    range: 1
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Sunrise/flashbang.ogg
      params:
        volume: 20
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
    predicted: true
  - type: CartridgeAmmo
    proto: BulletGrenadeFlashBang
    deleteOnSpawn: true
  - type: Explosive
    explosionType: Default
    totalIntensity: 4
    intensitySlope: 1
    maxIntensity: 2
    canCreateVacuum: false
    maxTileBreak: 0
  - type: WhitelistTriggerCondition
    userBlacklist:
      components:
        - AdminMinigun


- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseWeaponTurret
  id: WeaponTurretCoreWMTestBla
  components:
    #- type: RadarBlip
     # color: "#647289"
      #scale: 0.4
      #shape: Circle
      #requireInSpace: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.45
          density: 60
          mask:
          - MachineMask
          layer:
          - MachineLayer
    - type: Sprite
      layers:
      - state: syndie_off
      - state: turretCore
        sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
      - state: turretCoreUnshaded
        sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
        shader: unshaded
    - type: RCDDeconstructable
      cost: 12
      delay: 6
    - type: PassiveDamage
      allowedStates:
       - Alive
      damage:
        types:
          Heat: -0.4
    - type: MobThresholds
      currentThresholdState : Alive
      thresholds:
        0: Alive
        500: Dead
    - type: NpcFactionMember
      factions:
        - CoreFaction
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 385 #485
          behaviors:
            - !type:TriggerBehavior
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Gun
      shotsPerBurst: 5
      fireRate: 7
      minAngle: 15
      maxAngle: 35
      angleIncrease: 1.5
      angleDecay: 6
      selectedMode: Burst
      availableModes:
      - Burst
      soundGunshot: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
    - type: Repairable 
      qualityNeeded: "Anchoring"
      doAfterDelay: 1
      damage:
        types:
          Blunt: -25
          Slash: -25
          Piercing: -25
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: Default
      maxIntensity: 3
      intensitySlope: 3
      totalIntensity: 3
      canCreateVacuum: false
      maxTileBreak: 0
    - type: BatteryAmmoProvider
      proto: BulletPistolTraceSP
      fireCost: 100
    - type: Battery
      maxCharge: 4000
      startingCharge: 0
      netsync: false
    - type: ApcPowerReceiverBattery
      idleLoad: 5
      batteryRechargeRate: 300
      batteryRechargeEfficiency: 3
    - type: ExtensionCableReceiver
    - type: BatterySelfRecharger
      autoRechargeRate: 10
   #   autoRecharge: True
    - type: ApcPowerReceiver
      powerLoad: 950


