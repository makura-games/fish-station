- type: entity
  categories: [ HideSpawnMenu ]
  parent: WeaponEarthGovLaserCarbine
  id: WeaponEarthGovLaserCarbineArmWM
  components:
  - type: Biocode
    factions:
    - ArmFaction
  - type: FactionWeaponBlocker
    factions:
    - ArmFaction
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
  - type: Gun
    fireRate: 1.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: RedHeavyLaserArm
    fireCost: 200
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 1
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 2100
  - type: BatterySelfRecharger
  #  autoRecharge: true
    autoRechargeRate: 40


- type: entity
  categories: [ HideSpawnMenu ]
  id: DronArmTurretMineWM
  parent: DronArmWM
  components:
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: AutoImplant
    implants:
    - LandmineImplantArmWM
  - type: GhostRole
    name: pw-vehicles-rebels-markerdronarmturretmine-name
    description: pw-vehicles-rebels-markerdronarmturretmine-desc
    raffle:
      settings: WM
  - type: PlanetWarBriefing
    briefingText: pw-briefing-rebels-dronarmturretmine
    briefingColor: "#e50000"
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM2/33xSprait.rsi
    noRot: false
    layers:
      - state: droneP1shedow
        noRot: false
        scale: 1.1, 1.1
      - state: droneP1Anim
        noRot: false
        scale: 1.05, 1.05
      - state: droneP1pimpred
        noRot: false
        scale: 1.05, 1.05
        shader: unshaded
        offset: 0, 0
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 8
    intensitySlope: 1
    maxIntensity: 8
    maxTileBreak: 0
  - type: MovementSpeedModifier
    baseWalkSpeed : 15
    baseSprintSpeed : 9
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 85
      behaviors:
      - !type:TriggerBehavior
  - type: MobThresholds
    thresholds:
      0: Alive
      86: Dead
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 9 #8.5
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: false
        layer:
          - SlipLayer
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 500000
        layer:
        - MobLayer #MachineLayer
        mask:
        - MobMask
  - type: Battery
    maxCharge: 60
    startingCharge: 60
  - type: BatterySelfRecharger
    autoRechargeRate: 1
  - type: Gun
    fireRate: 4
    minAngle: -8
    maxAngle: 25
    selectedMode: FullAuto  #FullAuto
    availableModes:
      - FullAuto  
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/SMGs/mp38/mp38_shot.ogg
      params:
        volume: -3
  - type: BatteryAmmoProvider
    proto: CartridgePistolWM
    fireCost: 2
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: PortalArmTinyWM


