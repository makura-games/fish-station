- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseLandMineWM
  id: LandMineFleshArmWM
  components:
  - type: FlashOnTrigger
    range: 1
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Sunrise/flashbang.ogg
      params:
        volume: 20
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
    predicted: true
  - type: CartridgeAmmo
    proto: BulletGrenadeFlashBang
    deleteOnSpawn: true
  - type: Explosive
    explosionType: Default
    totalIntensity: 4
    intensitySlope: 1
    maxIntensity: 2
    canCreateVacuum: false
    maxTileBreak: 0
  - type: WhitelistTriggerCondition
    userBlacklist:
      components:
        - Thruster
  - type: StepTrigger
    blacklist:
      components:
        - Thruster 
  - type: Sprite
    drawdepth: Items
    sprite: Objects/Misc/landmine.rsi
    layers:
    - state: landmine
    - state: landmine-unshaded
      shader: unshaded
      map: [ "enum.ToggleableVisuals.Layer" ]


