    table: !type:GroupSelector
      children:
      - id: LandMineFleshArmWM
        weight: 70
      - id: LandMineExplosiveArmWM
        weight: 30


- type: entity
  parent: BoxDronCoreWM
  id: BoxDronArmWM
  components:
  - type: SpawnItemsOnUse
    items:
    - id: DronArmWM


- type: entity
  categories: [ HideSpawnMenu ]
  id: DronArmWM
  parent: DronCoreWM
  components:
  #- type: RadarBlip
  #  color: "#e50000"
  #  scale: 0.4
  #  shape: Circle
  #  requireInSpace: false
  - type: GhostRole
    name: pw-vehicles-rebels-dronarm-name-1
    description: pw-vehicles-rebels-dronarm-desc
    raffle:
      settings: WM
  - type: PlanetWarBriefing
    briefingText: pw-briefing-rebels-dronarm
    briefingColor: "#e50000"
  - type: StepTrigger
    blacklist:
      components:
      - Thruster
    requiredTriggeredSpeed: 0.2
  - type: NpcFactionMember
    factions:
    - ArmFaction
  - type: Access
    tags:
    - AssArmBase
  - type: ActiveRadio
    channels:
    - RadioChannelArm
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    noRot: false
    layers:
      - state: shedow
        noRot: false
        scale: 1.05, 1.05
      - state: droneAnim
        noRot: false
        offset: 0, 0
      - state: dronepimpred
        noRot: false
        shader: unshaded
        offset: 0, 0


- type: entity
  categories: [ HideSpawnMenu ]
  id: DronArmPortalWM
  parent: DronArmWM
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:AllSelector
        children:
        - id: PortalArmTinyWM


- type: entity
  id: StationDronBeaconArm
  parent: StationDronBeaconCore
