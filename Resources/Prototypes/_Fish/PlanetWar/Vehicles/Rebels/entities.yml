    layers:
      - state: stationDronRed
        scale: 1.5, 1.5
      - state: stationDronRedPimp
        shader: unshaded
        scale: 1.5, 1.5
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: MarkerSpawnDronStationArm


- type: entity
  id: StationDronBeaconArmWMMizeliy
