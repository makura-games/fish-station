- type: entity
  id: MechHeavyCoreWM
  suffix: WM
  parent:
   - MechMarauder
  components:
 # - type: Physics
  #  bodyType: Dynamic
  #- type: RadarBlip
  #  color: "#0000e3"
  #  scale: 0.8
  #  shape: Circle
  #  requireInSpace: false
  - type: ContainmentField
    throwForce: 2
  - type: AdminMinigun
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.70
        density: 10000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeThrowOnHit
    distance: 6
    speed: 3
  - type: Sprite
    scale: 1.8, 1.8
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageHightWM
  - type: Mech
    airtight: false
    startingEquipment:
      - WeaponMechCombatMGWM
    mechToPilotDamageMultiplier: 0.01
    maxEquipmentAmount: 1
    pilotWhitelist:
      components:
        - AdminMinigun
    pilotBlacklist:
      components:
        - ScaleVisuals
  - type: MeleeWeapon
    attackRate: 0.3
    range: 1.5
    damage:
      types:
        Blunt: 80
        Structural: 120
  - type: MobThresholds
    currentThresholdState : Alive
    thresholds:
      0: Alive
      1000: Critical
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: PassiveDamage
    allowedStates:
    - Critical
    damage:
      types:
        Blunt: 4
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 1.6
  - type: PowerCellDraw
    drawRate: 0
   # useRate: 0
  - type: UseDelay
    delay: 10.0
  - type: ExplosionResistance
    damageCoefficient: 0.55
  - type: AccessReader
    access: [["AssCoreBase"]]
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    radius: 16
    netsync: true #включает свет у всех
    falloff: 2
    softness: 1
    autoRot: true
    color: "#0057e7"
  - type: Reflect
    reflectProb: 0.25
    spread: 260


- type: entity
  id: GrusCoreWM
  suffix: WM
  parent:
   - MechHeavyCoreWM
  components:
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCyborgSpider
      params:
        pitch: 0.5
        volume: 10
 # - type: Rotatable
 #   rotateWhileAnchored: true
 # - type: RadarBlip
 #   scale: 0.9
  - type: RequireProjectileTarget
    active: true
  - type: Physics
    bodyStatus: InAir
    bodyType: KinematicController
    fixedRotation: false
  - type: ContainmentField
    throwForce: 0
  - type: CombatMode
    toggleMouseRotator: false
  - type: MouseRotator
    angleTolerance: 5
    rotationSpeed: 180
    simple4DirMode: false
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-1.3,0.9, 1.5"
        density: 10000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Reflect
    reflectProb: 0.15
    spread: 360
  - type: Sprite
    scale: 1, 1
    noRot: false
    sprite: /Textures/_Fish/PlanetWar/WM2/100xSprait.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: coregruz
  - type: MeleeThrowOnHit
    distance: 3
    speed: 4
  - type: Mech
    baseState: coregruz
    openState: coregruz
    brokenState: coregruz
    mechToPilotDamageMultiplier: 0.1
    maxEquipmentAmount: 2
    startingEquipment:
      - WeaponMechCombatLightWM
      - WeaponGrusWM
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Critical
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: PassiveDamage
  - type: MeleeWeapon
    attackRate: 0.75
    range: 0
    damage:
      types:
        Blunt: 1
        Structural: 1
  - type: MovementSpeedModifier
    baseWalkSpeed: 7
    baseSprintSpeed: 4
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageTankWM
  - type: Strap
    handBuckle: true
    position: Down
    buckleOffsets:
    - "0,0.2"
    - "0,0.4"
    - "0,0.6"
    - "0,0.8"
    - "0,1.0"
    - "0,1.1"
    size: 1000
    whitelist:
      components:
       - AdminMinigun
  - type: TileFrictionModifier
    modifier: 0.2
  - type: Body
 # - type: Loadout
 #   prototypes: [WMGearGrusCore]
  - type: Hands
    showInHands: false


