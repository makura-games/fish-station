- type: entity
  id: FishCentCommSupplyConsole
  parent: BaseComputerSunrise
  name: CentComm supply console
  suffix: Fish
  description: A secure console for ordering supplies for a station.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: salary
    - map: ["computerLayerKeys"]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: salary_key
  - type: CentCommSupplyConsole
    maxCratesPerOrder: 6
    maxProductsPerOrder: 8
  - type: ActivatableUI
    key: enum.CentCommSupplyUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.CentCommSupplyUiKey.Key:
        type: CentCommSupplyBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: FishCentCommSupplyComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: AccessReader
    access: [["CentralCommand"]]
