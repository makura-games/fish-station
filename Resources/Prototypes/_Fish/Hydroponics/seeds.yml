    sprite: _Fish/Objects/Specific/Hydroponics/oxygen_mango.rsi
  - type: PlantData
    name: ent-MangoSeeds
    packetPrototype: OxygenMangoSeeds
    productPrototypes: [ FoodOxygenMango ]
  - type: Plant
    lifespan: 50
    maturation: 6
    production: 6
    yield: 3
    potency: 10
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
