- type: entity
  parent: BasePlant
  id: Mango
  categories: [HideSpawnMenu]
  name: mango tree
  components:
  - type: Sprite
    sprite: _Fish/Objects/Specific/Hydroponics/mango.rsi
  - type: PlantData
    name: ent-MangoSeeds
    packetPrototype: MangoSeeds
    productPrototypes: [ FoodMango ]
    mutationPrototypes: [ OxygenMango ]
  - type: Plant
    lifespan: 50
    maturation: 6
    production: 6
    yield: 3
    potency: 10
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 3
        max: 13
        potencyDivisor: 15
      Vitamin:
        min: 2
        max: 6
        potencyDivisor: 25

- type: entity
