- type: entity
  name: ert assault sword
  parent: [ BaseSword, BaseCommandContraband ]
  id: FishERTSword
  suffix: FISH
  description: An assault sword utilized by Nanotrasen emergency response teams.
  components:
  - type: Sprite
    scale: 0.6, 0.6
    sprite: _Fish/Objects/Weapons/Melee/fish_ert_sword.rsi
    state: icon
  - type: Clothing
    sprite: _Fish/Objects/Weapons/Melee/fish_ert_sword.rsi
    quickEquip: false
    slots:
    - Back
    - Belt
  - type: Reflect
    reflects:
    - NonEnergy
    reflectProb: 0.40
    spread: 90
  - type: Item
    size: Large
  - type: UseDelay
    delay: 3
  - type: DisarmMalus
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Sunrise/Items/Handling/sabre_drop.ogg
  - type: MeleeWeapon
    wideAnimationRotation: -120
    attackRate: 1
    damage:
      types:
        Slash: 40
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: ItemSwitch
    state: cut
    states:
      cut: !type:ItemSwitchState
        verb: vibroblade-cut
        soundStateActivate:
          path: /Audio/Weapons/ebladeoff.ogg
        sprite:
          sprite: _Fish/Objects/Weapons/Melee/fish_ert_sword.rsi
          state: icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -120
          attackRate: 1
          damage:
            types:
              Slash: 40
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
      ap: !type:ItemSwitchState
        verb: vibroblade-ap
        soundStateActivate:
          path: /Audio/Weapons/ebladeon.ogg
        sprite:
          sprite: _Fish/Objects/Weapons/Melee/fish_ert_sword.rsi
          state: icon-on
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          angle: 0
          animation: WeaponArcThrust
          attackRate: 1
          damage:
            types:
              Piercing: 25
          resistanceBypass: true
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
