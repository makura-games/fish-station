- type: entity
  name: mango
  parent: FoodProduceBase
  id: FoodMango
  description: Mango mango mango mango!
  components:
  - type: FlavorProfile
    flavors:
      - mango
  - type: Solution
    solution:
      maxVol: 25
      reagents:
      - ReagentId: Nutriment
        Quantity: 13
      - ReagentId: Vitamin
        Quantity: 5
  - type: Sprite
    sprite: _Fish/Objects/Specific/Hydroponics/mango.rsi
    state: produce # Fish-Edit: ясный стейт для предсказуемого отображения
  - type: Produce
    seedId: Mango
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceMango
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    - Mango

- type: entity
  name: oxygen mango
  parent: [FoodProduceBase, ItemHeftyBase]
  id: FoodOxygenMango
  description: mango with iron and oxygen
  components:
  - type: FlavorProfile
    flavors:
      - oxygenmango
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 4
      - ReagentId: Dexalin
        Quantity: 10
      - ReagentId: Saline
        Quantity: 10
  - type: Sprite
    sprite: _Fish/Objects/Specific/Hydroponics/oxygen_mango.rsi
  - type: Produce
    seedId: OxygenMango
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceMango
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    - Mango
