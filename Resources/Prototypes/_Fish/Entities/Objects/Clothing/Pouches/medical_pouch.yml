# Базовые варианты носятся в карманах; доступ в медицинские пояса даёт только тег FishPouchMedical у отдельных вариантов.
- type: entity
  parent: [BaseClothingBeltSounds, ClothingBeltStorageBase, ContentsExplosionResistanceBase]
  id: FishPouchMedical
  name: medical pouch
  description: A pouch for carrying medicine bottles.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical.rsi
    scale: 0.75, 0.75
    layers:
    - state: icon
  - type: Appearance
  - type: Item
    size: Normal # внешний размер 2x2
  - type: Clothing
    quickEquip: false
    slots:
    - pocket # позволяет класть подсумок в обычный карман несмотря на размер
  - type: Storage
    maxItemSize: Small # строго меньше Normal, иначе ремень не примет вложенную ёмкость
    grid:
    - 0,0,4,1 # 5x2 = 10 слотов
    whitelist:
      tags:
      - Bottle # используется общий тег флаконов, а не проверка содержащихся в них реагентов
  # Защита распространяется на содержимое без передачи владельцу; Damageable самому подсумку не добавляется.
  - type: ExplosionResistance
    damageCoefficient: 0.01 # содержимому наносится 1% взрывного урона
    worn: false # защита не передаётся владельцу

- type: entity
  parent: FishPouchMedical
  id: FishPouchMedicalParamedic
  name: paramedic medical pouch
  description: A red and white pouch for carrying medicine bottles.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical_paramedic.rsi

- type: entity
  parent: FishPouchMedical
  id: FishPouchMedicalNanotrasen
  name: Nanotrasen medical pouch
  description: A dark medical pouch for carrying medicine bottles. Made for professionals.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical_nanotrasen.rsi
  - type: Tag
    tags:
    - WhitelistChameleon # сохраняем тег одежды при переопределении списка тегов
    - FishPouchMedical

- type: entity
  parent: FishPouchMedical
  id: FishPouchMedicalBrigmedic
  name: brigmedic medical pouch
  description: A pouch for carrying medicine bottles, issued to brigmedics.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical_brigmedic.rsi

- type: entity
  parent: FishPouchMedical
  id: FishPouchMedicalBluespace
  name: bluespace medical pouch
  description: A compact pouch for medicine bottles. Bluespace technology provides more room than its exterior suggests.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical_bluespace.rsi
    scale: 1, 1
  - type: Item
    size: Small
    shape:
    - 0,0,0,1 # внешний размер 1 столбец на 2 строки не зависит от размера кадра спрайта
  - type: Storage
    grid:
    - 0,0,4,2 # внутреннее хранилище: 5 столбцов и 3 строки, 15 ячеек по горизонтали
  - type: Tag
    tags:
    - WhitelistChameleon
    - FishPouchMedical

- type: entity
  parent: FishPouchMedical
  id: FishPouchMedicalSyndicate
  name: syndicate medical pouch
  description: A blood-red pouch for carrying medicine bottles and more.
  components:
  - type: Sprite
    sprite: _Fish/Objects/Clothing/Pouches/medical_syndicate.rsi
  - type: Storage
    grid:
    - 0,0,7,1 # 8 столбцов и 2 строки = 16 ячеек, горизонтально
  - type: Tag
    tags:
    - WhitelistChameleon
    - FishPouchMedical
