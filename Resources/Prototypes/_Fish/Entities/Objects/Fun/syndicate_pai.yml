# Fish — Syndicate pAI medical suite, support tools and module actions

- type: entity
  parent: HypoBorgMedicalSyndicate
  id: HypoPaiSyndicateMedical
  name: syndicate pAI hypospray
  description: An integrated Syndicate pAI hypospray. Regenerates combat-medicine reagents and can inject the bound owner without hands.
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: hypospray
    solution:
      maxVol: 20
  - type: SolutionRegeneration
    duration: 2
    generated:
      reagents:
      - ReagentId: HemostaticPowder
        Quantity: 1
  - type: SolutionRegenerationSwitcher
    options:
    - ReagentId: HemostaticPowder
      Quantity: 1
    - ReagentId: Dermaline
      Quantity: 1
    - ReagentId: DexalinPlus
      Quantity: 1
    - ReagentId: Ephedrine
      Quantity: 1
    - ReagentId: Dylovene
      Quantity: 1
    - ReagentId: Saline
      Quantity: 1
    keepSolution: false
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HypoPaiSyndicateMode
    allowedModes:
    - HypoPaiSyndicateMode
    currentTransferAmount: 5
    needHand: false
    breakOnHandChange: false
  - type: BorgHypospray

# Экстренный резервуар автодозатора — смесь стандартных лекарств
- type: entity
  parent: HypoBorgMedicalSyndicate
  id: HypoPaiSyndicateAuto
  name: syndicate pAI emergency hypospray
  description: An emergency auto-dispenser reservoir for a Syndicate pAI. Slowly regenerates a mix of standard medicines and only injects the bound owner.
  categories: [ HideSpawnMenu ]
  components:
  - type: SyndicatePaiAutoHypo
  - type: Solution
    id: hypospray
    solution:
      maxVol: 10
  - type: SolutionRegeneration
    duration: 1
    generated:
      reagents:
      - ReagentId: Bicaridine
        Quantity: 0.0625
      - ReagentId: Dermaline
        Quantity: 0.0625
      - ReagentId: TranexamicAcid
        Quantity: 0.0625
      - ReagentId: DexalinPlus
        Quantity: 0.0625
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HypoPaiSyndicateMode
    allowedModes:
    - HypoPaiSyndicateMode
    # null = ввести весь резервуар при автоинъекции
    currentTransferAmount: null
    needHand: false
    breakOnHandChange: false
  - type: BorgHypospray

- type: entity
  parent: GasAnalyzer
  id: GasAnalyzerPai
  name: pAI atmosphere sensor
  description: An integrated atmosphere sensor module for a personal AI.
  categories: [ HideSpawnMenu ]
  components:
  - type: ActivatableUI
    inHandsOnly: false
    requireActiveHand: false
    singleUser: true
    key: enum.GasAnalyzerUiKey.Key

# Actions

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiOpenMedical
  name: Medical Suite
  description: Open the Syndicate pAI medical suite.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Medical/syndihypo.rsi, state: hypo }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:SyndicatePaiOpenMedicalEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiScanOwner
  name: Scan Owner
  description: Instantly open a health scan of your bound master.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Medical/healthanalyzer.rsi, state: icon }
    itemIconStyle: NoItem
    useDelay: 1
  - type: InstantAction
    event: !type:SyndicatePaiScanOwnerEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiDoorHack
  name: Doorjack Pulse
  description: Disrupt access on doors within three tiles of your owner. Two charges, five minutes to restore one charge.
  components:
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 300
  - type: Action
    icon: { sprite: Objects/Tools/access_breaker.rsi, state: icon }
    itemIconStyle: NoItem
    useDelay: 1
  - type: InstantAction
    event: !type:SyndicatePaiDoorHackEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiSecRecords
  name: Security Records
  description: Remotely access and edit the station criminal records database.
  components:
  - type: Action
    icon: { sprite: _Sunrise/Objects/Devices/handheld_criminal_records_monitor.rsi, state: icon }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:SyndicatePaiOpenSecRecordsEvent
