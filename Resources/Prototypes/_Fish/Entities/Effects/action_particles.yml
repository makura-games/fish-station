- type: entity
  id: FishActionParticleBase
  abstract: true
  suffix: Fish
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Fish/Effects/action_particles.rsi
    drawdepth: Effects
    noRot: true
  - type: TimedDespawn
    lifetime: 0.48
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  parent: FishActionParticleBase
  id: FishBloodParticle
  suffix: Fish
  components:
  - type: Sprite
    state: drop

- type: entity
  parent: FishActionParticleBase
  id: FishWeldParticle
  suffix: Fish
  components:
  - type: Sprite
    layers:
    - state: ember
      shader: unshaded

- type: entity
  parent: FishActionParticleBase
  id: FishSlagParticle
  suffix: Fish
  components:
  - type: Sprite
    state: slag

- type: entity
  parent: FishActionParticleBase
  id: FishSplashParticle
  suffix: Fish
  components:
  - type: Sprite
    state: splash
