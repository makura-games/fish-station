- type: entity
  id: FishRandomHumanoidSpawnerCBURNLeader
  name: CBURN Leader
  suffix: Fish, ERTRole
  components:
    - type: Sprite
      sprite: Markers/jobs.rsi
      state: cburn
    - type: RandomHumanoidSpawner
      settings: FishCBURNLeader

- type: randomHumanoidSettings
  id: FishCBURNLeader
  parent: EventHumanoidERTSunrise
  speciesBlacklist:
  - Diona
  - Vox
  - Felinid
  - Moth
  - Arachnid
  - Reptilian
  - Vulpkanin
  - Swine
  - Tajaran
  - Demon
  - SlimePerson
  - Dwarf
  - HumanoidXeno
  - Predator
  - Kitsune
  components:
    - type: Loadout
      prototypes: [ FishCBURNLeaderGear ]
      roleLoadout: [ RoleSurvivalExtended ]
    - type: GhostRole
      name: ghost-role-information-cburn-leader-name
      description: ghost-role-information-cburn-leader-description
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: short
    - type: RandomMetadata
      nameSegments:
      - NamesMilitaryFirstLeader
      - NamesMilitaryLast
      nameFormat: name-format-ert

