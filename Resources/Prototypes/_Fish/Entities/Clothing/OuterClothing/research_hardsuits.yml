- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCargoContraband]
  id: FishClothingOuterHardsuitExpedition
  name: expedition hardsuit
  description: A yellow expedition hardsuit with reinforced joints and thick protective lining.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/OuterClothing/Hardsuits/expedition.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Fish/Clothing/OuterClothing/Hardsuits/expedition.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
  - type: PressureProtection
    highPressureMultiplier: 0.04
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.55
        Piercing: 0.75
        Heat: 0.7
        Cold: 0.7
        Radiation: 0.2
        Caustic: 0.45
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: FishClothingHeadHelmetHardsuitExpedition

