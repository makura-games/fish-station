- type: entity
  parent: ClothingHeadHelmetVoidParamed
  id: ClothingHeadHelmetVoidParamedFish
  name: paramedic void helmet
  description: A void helmet made for paramedics.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/paramedhelm.rsi
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/paramedhelm.rsi
    clothingVisuals: # Fish
      head:
      - state: equipped-head
      head-vox:
      - state: equipped-head
      head-dog:
      - state: equipped-head
  - type: ToggleableVisuals
    clothingVisuals: # Fish
      head:
      - state: equipped-head-light
      head-vox:
      - state: equipped-head-light
      head-dog:
      - state: equipped-head-light

- type: entity
  parent: [ FishClassicHardsuitHelmetVisuals, ClothingHeadHelmetHardsuitDeathsquad, BaseSunriseHardsuitHelmetNVD, FishHardsuitHelmetNightVisionCyan ]
  id: ClothingHeadHelmetHardsuitDeathsquadFish
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/deathsquad.rsi
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/deathsquad.rsi
  - type: PointLight
    radius: 9
    energy: 9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
        Radiation: 0.80
        Caustic: 0.95
        Poison: 0.80
        Shock: 0.80

- type: entity
  parent: [ ClothingHeadHelmetHardsuitSecurityRed, BaseSunriseHardsuitHelmetNVD, FishHardsuitHelmetNightVisionCyan ]
  id: FishClothingHeadHelmetHardsuitCentcomBlack
  categories: [ HideSpawnMenu, DoNotMap ]
  name: field hardsuit helmet
  description: Designed for an elite special operations officer.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/centcom_officer_black.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ light ]
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/centcom_officer_black.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    color: '#4ac4ff'
    radius: 6
    energy: 2
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

# Классический формат спрайтов шлемов с фонарём (icon / icon-flash, off/on-equipped-HELMET).
# Варианты для рас (-vox и др.) подхватываются автоматически через ClientClothingSystem.
- type: entity
  id: FishClassicHardsuitHelmetVisuals
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ light ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET

