# Fish-оптика для шлемов без собственного переключателя ПНВ.
# Цвета совпадают с прежними вариантами Sunrise, чтобы не менять внешний вид.
- type: entity
  id: FishHardsuitHelmetNightVisionCyan
  suffix: Fish
  abstract: true
  components:
  - type: FishVisionDevice
  - type: ComponentToggler
    parent: true
    components:
    - type: FishNightVision
      color: "#00FFFF"
      lightingColor: "#00FFFF26"

- type: entity
  id: FishHardsuitHelmetNightVisionWhite
  suffix: Fish
  abstract: true
  components:
  - type: FishVisionDevice
  - type: ComponentToggler
    parent: true
    components:
    - type: FishNightVision
      color: "#FFFFFF"
      lightingColor: "#FFFFFF26"

- type: entity
  id: FishHardsuitHelmetNightVisionMint
  suffix: Fish
  abstract: true
  components:
  - type: FishVisionDevice
  - type: ComponentToggler
    parent: true
    components:
    - type: FishNightVision
      color: "#ADFFEC"
      lightingColor: "#ADFFEC26"

- type: entity
  id: FishHardsuitHelmetNightVisionPurple
  suffix: Fish
  abstract: true
  components:
  - type: FishVisionDevice
  - type: ComponentToggler
    parent: true
    components:
    - type: FishNightVision
      color: "#CBADFF"
      lightingColor: "#CBADFF26"

- type: entity
  parent: ClothingHeadHelmetVoidParamed
  id: ClothingHeadHelmetVoidParamedFish
  name: paramedic void helmet
  description: A void helmet made for paramedics.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/paramedhelm.rsi
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/paramedhelm.rsi
    clothingVisuals: # Fish
      head:
      - state: equipped-head
      head-vox:
      - state: equipped-head
      head-dog:
      - state: equipped-head
  - type: ToggleableVisuals
    clothingVisuals: # Fish
      head:
      - state: equipped-head-light
      head-vox:
      - state: equipped-head-light
      head-dog:
      - state: equipped-head-light

- type: entity
  parent: ClothingHeadHelmetHardsuitDeathsquad
  id: ClothingHeadHelmetHardsuitDeathsquadFish
  suffix: Fish
  components:
  - type: PointLight
    radius: 9
    energy: 9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
        Radiation: 0.80
        Caustic: 0.95
        Poison: 0.80
        Shock: 0.80
  - type: ItemToggle
    predictable: false
    onUse: false
    canActivateInhand: false
    soundActivate:
      path: /Audio/_Sunrise/Items/Goggles/activate.ogg
    soundDeactivate:
      path: /Audio/_Sunrise/Items/Goggles/deactivate.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: FishVisionDevice
  - type: ComponentToggler
    parent: true
    components:
    - type: FishNightVision
  - type: ToggleClothing
    action: NVDToggleAction
    mustEquip: true
    disableOnUnequip: true
    targetSlot: head

- type: entity
  parent: [ ClothingHeadHelmetHardsuitSecurityRed, BaseSunriseHardsuitHelmetNVD, FishHardsuitHelmetNightVisionCyan ]
  id: FishClothingHeadHelmetHardsuitCentcomBlack
  categories: [ HideSpawnMenu, DoNotMap ]
  name: field hardsuit helmet
  description: Designed for an elite special operations officer.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/centcom_officer_black.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ light ]
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/centcom_officer_black.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    color: '#4ac4ff'
    radius: 6
    energy: 2
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
