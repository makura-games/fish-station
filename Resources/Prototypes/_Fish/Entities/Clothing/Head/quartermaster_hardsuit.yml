- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitQuartermaster
  name: quartermaster hardsuit helmet
  description: A sturdy helmet with an integrated lamp and reinforced visor.
  components:
  - type: Sprite
    sprite: _Fish/Clothing/Head/Hardsuits/quartermasterhelm.rsi
    layers:
    - state: icon
    - state: icon-flash
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: _Fish/Clothing/Head/Hardsuits/quartermasterhelm.rsi
  - type: PointLight
    radius: 10
  - type: PressureProtection
    highPressureMultiplier: 0.09
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.09
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.9
        Heat: 0.80
        Caustic: 0.95
        Radiation: 0.225
