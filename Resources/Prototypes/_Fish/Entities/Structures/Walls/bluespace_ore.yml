- type: entity
  abstract: true
  id: FishBaseVeinBluespaceCrystal
  suffix: Fish
  description: Blue crystals shimmer within the rock.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: FishOreBluespaceCrystal
  - type: Sprite
    layers:
    - state: rock_bluespace_crystal
      sprite: _Fish/Structures/Walls/bluespace_ore.rsi
      map: ["enum.MiningScannerVisualLayers.Overlay"]

# Fish-edit: SmoothEdge требует отдельные слои основания и четырёх краёв.
- type: entity
  parent: [FishBaseVeinBluespaceCrystal, AsteroidRock]
  id: FishAsteroidRockBluespaceCrystal
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers:
    - state: rock_asteroid
    - map: ["enum.EdgeLayer.South"]
      state: rock_asteroid_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_asteroid_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_asteroid_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_asteroid_west
    - state: rock_bluespace_crystal
      sprite: _Fish/Structures/Walls/bluespace_ore.rsi
      map: ["enum.MiningScannerVisualLayers.Overlay"]

