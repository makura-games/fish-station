- type: entity
  parent: [FishBaseVeinBluespaceCrystal, WallRock]
  id: FishWallRockBluespaceCrystal
  suffix: Fish
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: FishAsteroidRockBluespaceCrystal
      IronRock: FishIronRockBluespaceCrystal
      WallRockChromite: FishWallRockChromiteBluespaceCrystal
      WallRockSand: FishWallRockSandBluespaceCrystal
      WallRockSnow: FishWallRockSnowBluespaceCrystal
      WallRockBasalt: FishWallRockBasaltBluespaceCrystal

- type: entity
  parent: [FishBaseVeinBluespaceCrystal, WallRockSnow]
