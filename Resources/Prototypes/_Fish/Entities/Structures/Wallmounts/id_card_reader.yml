- type: entity
  parent: BaseWallmountMetallic
  id: FishIdCardReader
  name: ID card reader
  description: A wall-mounted device that checks inserted ID cards and transmits logic signals.
  suffix: Custom
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Fish/Structures/Wallmounts/id_card_reader.rsi
    state: base
  - type: IdCardReader
  - type: AccessReader
  - type: ItemSlots
    slots:
      IdCardReader-card:
        name: id-card-reader-slot-name
        insertSound: /Audio/Machines/id_insert.ogg
        ejectSound: /Audio/Machines/id_swipe.ogg
        ejectOnInteract: true
        ejectOnBreak: true
        swap: false
        whitelist:
          components:
          - IdCard
  - type: ContainerContainer
    containers:
      IdCardReader-card: !type:ContainerSlot
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    ports:
    - FishIdCardInserted
    - FishIdCardRemoved
    - FishIdCardAccessGranted
    - FishIdCardLocalAuthorization
    - FishIdCardReaderCloseRequest
    lastSignals:
      FishIdCardAccessGranted: false
      FishIdCardLocalAuthorization: false
  - type: DeviceLinkSink
    ports:
    - FishIdCardReaderAuthorization
    - FishIdCardReaderDoorStatus
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

