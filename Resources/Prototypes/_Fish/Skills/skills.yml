# Навыки Fish Station. Уровни 1–5; стоимость шагов: 2 / 3 / 5 / 8 (мастер с нуля = 18).
# Книги обучают максимум до уровня 4 (опытный).
- type: skill
  id: FishSkillConstruction
  name: skills-construction-name
  description: skills-construction-desc
  category: engineering
  difficulty: 2
  # defaultMax: потолок без явной записи в maxSkills бюджета роли (Trained).
  defaultMax: 3
  delayFactor: 0.3
  durationMultipliers:
    1: 1.5
    2: 1.25
    3: 1.0
    4: 0.8
    5: 0.65

