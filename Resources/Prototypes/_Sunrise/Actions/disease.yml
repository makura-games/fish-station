# Fish-edit: To remove - прототипы разумной болезни
- type: entity
  parent: BaseAction
  id: ActionInfect
  name: Infect
  description: Attempt to infect a target. Uses charges.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    checkCanInteract: false # Fish-edit: не блокировать через ActionBlocker.CanInteract
  # Fish-start: перенос иконки в компонент Sprite
  - type: Sprite
    sprite: _Sunrise/Actions/disease.rsi
    layers:
    - state: action
  # Fish-end
  - type: TargetAction
    range: 2.5 # Fish-edit: дистанция заражения
    checkCanAccess: false # Fish-edit: преодоление препятствий
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidProfile
    canTargetSelf: false
    event: !type:InfectEvent
  - type: LimitedCharges # Fish-edit: заряды для попыток заражения
    maxCharges: 3

- type: entity
  parent: BaseAction
  id: ActionDiseaseShop
  name: Disease Shop
  description: Open the disease mutation menu.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action

  # Fish-start: перенос иконки в компонент Sprite
  - type: Sprite
    sprite: _Sunrise/Actions/disease.rsi
    layers:
    - state: shop
  # Fish-end
  - type: InstantAction
    event: !type:DiseaseShopActionEvent











