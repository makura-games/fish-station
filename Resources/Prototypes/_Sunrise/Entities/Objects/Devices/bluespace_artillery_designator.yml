- type: entity
  parent: Binoculars
  id: BluespaceArtilleryDesignator
  name: BSA LCU
  description: A handheld laser designator for requesting NanoTrasen bluespace artillery strikes. Three non-rechargeable charges. Wield (Z) to look far and designate targets at range. (use LMB to designate a target, after several seconds a marker will appear where the BSA will strike) # Fish edit
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Devices/bluespace_artillery_designator.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _Sunrise/Objects/Devices/bluespace_artillery_designator.rsi
  - type: Clothing
    sprite: _Sunrise/Objects/Devices/bluespace_artillery_designator.rsi
    quickEquip: false
    slots:
    - Neck
  - type: LimitedCharges
    maxCharges: 3
    lastCharges: 3
  - type: BluespaceArtilleryDesignator
    targetingDelay: 2
    strikeDelay: 7
    targetMarker: EffectBluespaceArtilleryTarget
    announcement: bluespace-artillery-announcement
    announcementSender: bluespace-artillery-announcement-sender
    announcementColor: "#00D4FF" # Fish edit
    announcementSound:
      path: /Audio/_Fish/Misc/artillery.ogg # Fish-edit
      params:
        volume: 10
    fireModes:
    - name: bluespace-artillery-mode-he
      explosionType: BluespaceArtilleryHE
      totalIntensity: 2094
      intensitySlope: 16
      maxIntensity: 80
      tileBreakScale: 1.5
      canCreateVacuum: true
    - name: bluespace-artillery-mode-frag
      explosionType: BluespaceArtilleryFrag
      totalIntensity: 1754
      intensitySlope: 5
      maxIntensity: 25
      tileBreakScale: 1
      canCreateVacuum: true
    - name: bluespace-artillery-mode-cluster
      explosionType: BluespaceArtilleryCluster
      totalIntensity: 3409
      intensitySlope: 15
      maxIntensity: 15
      tileBreakScale: 0.5
      canCreateVacuum: false

- type: entity
  parent: BluespaceArtilleryDesignator
  id: AdminBluespaceArtilleryDesignator
  suffix: Admin
  name: ADMIN BSA LCU
  description: An admin bluespace artillery designator with nearly unlimited charges and instant targeting lock. (use LMB to designate a target, after several seconds a marker will appear where the BSA will strike) # Fish edit
  components:
  - type: LimitedCharges
    maxCharges: 999
    lastCharges: 999
  - type: BluespaceArtilleryDesignator
    targetingDelay: 0
    strikeDelay: 7

- type: entity
  id: EffectBluespaceArtilleryTarget
  categories: [ HideSpawnMenu ]
  name: bluespace artillery target
  components:
  - type: Transform
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _Sunrise/Effects/bluespace_artillery_target.rsi
    layers:
    - state: laser_target
      shader: unshaded
      scale: 0.5, 0.5
  - type: TimedDespawn
    lifetime: 9
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    radius: 2
    energy: 2
    color: "#FF0000"
