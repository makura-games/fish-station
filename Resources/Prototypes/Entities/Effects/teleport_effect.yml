- type: entity
  parent: FishStationEffectBase # Fish-edit: общая пиксельная графика эффектов
  id: TeleportEffectSource
  components:
    # Fish-start: текстура и порядок отрисовки наследуются от FishStationEffectBase
    - type: Sprite
      layers:
        - state: source
          shader: unshaded
      netsync: false
    # Fish-end
    - type: PointLight
      color: "#008DFE"
    - type: EmitSoundOnSpawn
      sound:
        path: /Audio/_Sunrise/Effects/electrical_short_circuit2.ogg
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true

- type: entity
  parent: FishStationEffectBase # Fish-edit: общая пиксельная графика эффектов
  id: TeleportEffectTarget
  components:
    # Fish-start: текстура и порядок отрисовки наследуются от FishStationEffectBase
    - type: Sprite
      layers:
        - state: target
          shader: unshaded
      netsync: false
    # Fish-end
    - type: PointLight
      color: "#008DFE"
    - type: EmitSoundOnSpawn
      sound:
        path: /Audio/_Sunrise/Effects/electrical_short_circuit2.ogg
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true
