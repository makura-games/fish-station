- type: entity
  parent: FishStationEffectBase # Fish-edit: общая пиксельная графика эффектов
  id: EffectSparks
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  # Fish-start: текстура и порядок отрисовки наследуются от FishStationEffectBase
  - type: Sprite
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      state: sparks
  # Fish-end
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

- type: entity
  parent: FishStationEffectBase # Fish-edit: общая пиксельная графика эффектов
  id: EffectTeslaSparks
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  # Fish-start: текстура и порядок отрисовки наследуются от FishStationEffectBase
  - type: Sprite
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      state: tesla
  # Fish-end
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/Effects/tesla_consume.ogg
      params:
        variation: 0.3