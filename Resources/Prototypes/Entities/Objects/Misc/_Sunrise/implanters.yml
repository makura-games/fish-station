- type: entity
  id: ImplanterExtractor
  parent: BaseImplanter
  name: implant extractor
  description: A specialized syringe for extracting subdermal implants.
  components:
  - type: Implanter
    currentMode: Draw
    implantOnly: true
    extractionMode: Random
    extractionFailureDamage:
      types:
        Bloodloss: 5
    deimplantFailureDamage:
      types:
        Bloodloss: 10
  - type: UserInterface
    interfaces:
      enum.ExtractorRadialMenuUiKey.Key:
        type: ExtractorRadialMenuBoundUserInterface
  - type: Tag
    tags:
    - Trash
