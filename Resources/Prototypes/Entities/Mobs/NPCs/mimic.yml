- type: entity
  name: mimic
  id: MobMimic
  parent: [ SimpleMobBase, MobCombat ]
  description: mob-mimic-description
  components:
  - type: Tag
    tags:
    - FootstepSound
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    sprite: Structures/Machines/VendingMachines/cola.rsi
    state: normal
  - type: Icon
    sprite: Structures/Machines/VendingMachines/cola.rsi
    state: normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 1000
        mask:
        - MobMask
        layer:
        - MachineLayer
  - type: AnimationPlayer
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 2
        Piercing: 8
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 2.5
  - type: Butcherable
    spawned:
    - id: DrinkChangelingStingCan
      amount: 1
  - type: StaminaDamageOnHit
    damage: 15
  - type: GhostRole
    allowMovement: false
    makeSentient: false
    allowSpeech: false
    reregister: true
    name: ghost-role-information-mimic-name
    description: ghost-role-information-mimic-description
    rules: ghost-role-information-mimic-rules
  - type: GhostTakeoverAvailable



