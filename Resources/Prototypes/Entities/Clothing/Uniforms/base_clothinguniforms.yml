- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolNormal, Clothing, BaseSlicingRefinable]
  id: UnsensoredClothingUniformBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 3
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 150
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformBase
  components:
  - type: SuitSensor
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 1200
  - type: StationLimitedNetwork
  # Sunrise start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Sunrise/Items/Handling/cloth_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Sunrise/Items/Handling/cloth_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Sunrise/Items/Handling/cloth_drop.ogg
  # Sunrise end
  # Fish-start - слот медали на форме (smart equip выключен: иначе Z снимает медаль вместо формы)
  # ContainerContainer required: ItemSlots EnsureContainer on ComponentInit would otherwise
  # add ContainerManager at spawn and fail PrototypeSaveTest.UninitializedSaveTest.
  - type: ItemSlots
    allowSmartEquip: false
    slots:
      medal:
        name: fish-clothing-slot-medal
        insertOnInteract: true
        whitelist:
          tags:
          - Medal
  - type: ContainerContainer
    containers:
      medal: !type:ContainerSlot
  - type: MedalHolder
  # Fish-end

- type: entity
  abstract: true
  parent: ClothingUniformBase
  id: ClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  # SUNRISE EDIT
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
    - NudeBottom # INTERACTIONS
  # SUNRISE EDIT

- type: entity
  abstract: true
  id: ClothingUniformFoldableBase
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded
